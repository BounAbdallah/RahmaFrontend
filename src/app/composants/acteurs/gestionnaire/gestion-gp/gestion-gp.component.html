<div class="container-fluid py-4">
  <!-- En-tête de la page -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">Gestion des GP (Gratuité Partielle)</h3>
    <div>
      <a href="gp-actifs.html" class="btn btn-outline-primary me-2">Voir les GP actifs</a>
      <a href="ajouter-annonce.html" class="btn btn-primary">Ajouter une annonce GP</a>
    </div>
  </div>

  <!-- Tableau des GP -->
  <div class="card shadow-sm rounded mb-4">
    <div class="card-header bg-dark text-white">
      <h6 class="mb-0">Liste des GP</h6>
    </div>
    <div class="card-body">
      <!-- Recherche et Filtres -->
      <div class="mb-3">
        <div class="d-flex justify-content-between">
          <input
            type="text"
            class="form-control"
            placeholder="Rechercher par nom"
            [(ngModel)]="searchText"
            (input)="onSearchChange()"
          />
          <select
            class="form-select"
            [(ngModel)]="selectedStatut"
            (change)="onSearchChange()"
          >
            <option value="">Statut</option>
            <option value="actif">Actif</option>
            <option value="en attente">En attentes</option>
          </select>
          <select
            class="form-select"
            [(ngModel)]="selectedDisponibilite"
            (change)="onSearchChange()"
          >
            <option value="">Disponibilité</option>
            <option value="Aujourd'hui">Aujourd'hui</option>
            <option value="Cette semaine">Cette semaine</option>
          </select>
        </div>
      </div>
      <!-- Tableau -->
      <table class="table table-hover table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Statut</th>
            <th>Nombre de réservations</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let gp of filteredChauffeur">
            <td>{{ gp.nom }}</td>
            <td>{{ gp.email }}</td>
            <td><span class="badge" [ngClass]="{'bg-success': gp.statut === 'actif', 'bg-danger': gp.statut === 'en attente'}">{{ gp.statut }}</span></td>
            <td>{{ gp.reservations }}</td>
            <td>
              <a href="/gestionnaire-space/details-gp/{{ gp.id }}" class="btn btn-sm btn-info">Voir détails</a>
              <a href="/gestionnaire-space/details-annonce-gp" class="btn btn-sm btn-secondary">Voir annonces</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
